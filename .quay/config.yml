# .quay/config.yml — generated by quay-init (SPEC §6 closed set).
# The provider mcp_entry points at the quay PLUGIN's vendored native runtime (delivered by the plugin,
# not laid down into this project). The loop section carries the target-project values the driver reads.
#
# The `gates:` block and the non-fast-mode `loop:` keys below were restored by hand from
# `git show <sha>:.quay/config.yml`: a config-less quay-init run takes write_config's heredoc branch
# (scripts/quay-init.sh:2392), which writes providers + the four fast-mode loop keys ONLY, dropping
# the gate chain and loop.board/loop.gates (the latter two are REQUIRED — `quay config validate`
# fails without them). quay-init's merge-preserving paths (ensure_loop_config et al.) only run when
# the file already exists.
providers:
  native:
    enabled: true
    path: "/data/home/yale/.claude/plugins/cache/quay/quay/0.9.0/vendor/quay-native"
    tasks_dir: "/data/home/yale/work/meta-cc/tasks"
    mcp_entry: ["node", "/data/home/yale/.claude/plugins/cache/quay/quay/0.9.0/vendor/quay-native/dist/quay-native.js", "mcp"]
    default_task_status: todo
    env:
      QUAY_NATIVE_TASKS_DIR: "/data/home/yale/work/meta-cc/tasks"
      QUAY_NATIVE_GOAL_DIR: "/data/home/yale/work/meta-cc/goals"
      QUAY_NATIVE_ADR_DIR: "/data/home/yale/work/meta-cc/docs/architecture/adr"
      QUAY_NATIVE_META_DIR: "/data/home/yale/work/meta-cc/meta"
gates:
  it0:
  - name: impl-row
    script: ./scripts/gates/it0-impl-row-check.sh
    argsKey: implRowArgs
  - name: ceiling-line-budget
    script: ./scripts/gates/it0-ceiling-line-budget-check.sh
    argsKey: lineBudgetArgs
  - name: vmeta-lag
    script: ./scripts/gates/vmeta-lag-check.sh
    argsKey: vmetaLagArgs
  - name: audit-independence
    script: ./scripts/gates/audit-independence-check.sh
    argsKey: auditIndependenceArgs
  - name: dogfood-evidence
    script: ./scripts/gates/it0-dogfood-evidence-gate.sh
    argsKey: dogfoodEvidenceArgs
  - name: backlog-projection
    script: ./scripts/gates/it0-backlog-projection-check.sh
    argsKey: backlogProjectionArgs
  - name: gate-hash
    script: ./scripts/gates/it0-gate-hash-check.sh
    argsKey: gateHashArgs
  - name: dod
    script: ./scripts/gates/it0-dod-check.sh
    argsKey: dodArgs
  - name: ceiling
    script: ./scripts/gates/it0-ceiling-check.sh
    argsKey: ceilingArgs
  fixed:
  - name: tree-hygiene
    script: ./scripts/gates/tree-hygiene-check.sh
  - name: worktree-branch-hygiene
    script: ./scripts/gates/worktree-branch-hygiene-check.sh
  - name: build-feasibility
    script: ./scripts/gates/build-feasibility-check.sh
    timeoutMs: 180000
  - name: worktree-cache-env
    script: ./scripts/checks/check-worktree-cache-env.sh
loop:
  repo_root: /data/home/yale/work/meta-cc
  board: native
  gates:
  - acceptance
  stop: until(.halt)
  policy: ready-first
  execution: dispatched
  audit: adversarial
  concurrency: 4
  routines:
  - name: history-mining
    trigger: every(3)
    probe: history-mining
  - name: self-validation
    trigger: every(5)
    probe: self-validation
  # quay's mechanical fan-in runs this project's test entrypoint with its own value-taking flags
  # (--buckets / --root / --state-dir / --runner / --log-file / --run-id, plus --test-concurrency=N).
  # If you ship scripts/test.sh, it MUST consume such a flag together with its VALUE (shift 2) and
  # MUST NOT read a flag's value as a positional test-file argument — otherwise every fan-in round
  # reds with "Could not find '<value>'" and burns a whole worker session.
  # Full contract + a drop-in case block: plugin/skills/init/SKILL.md, section "loop.test_command
  # contract".
  test_command: go test ./...
  tmux_session: null
  worktree_root: /data/home/yale/work/meta-cc/../meta-cc-worktrees
  fork_baseline: develop
