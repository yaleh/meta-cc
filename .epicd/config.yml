project_name: "meta-cc"
default_status: "Basic: Proposal"
statuses: ["Epic: Proposal", "Epic: Plan", "Epic: Backlog", "Epic: Ready", "Epic: Decomposing", "Epic: Awaiting Children", "Epic: Evaluating", "Epic: Done", "Epic: Needs Human", "Basic: Proposal", "Basic: Plan", "Basic: Backlog", "Basic: Ready", "Basic: In Progress", "Basic: Done", "Basic: Needs Human"]
labels: []
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: true
default_port: 6420
remote_operations: true
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
task_prefix: "task"
task_actions:
  - id: "dispatch-to-worker"
    label: "Dispatch to Worker"
    command: 'manda-dispatch submit -id="$TASK_ID" -to=worker -async -args="$(jq -nc --arg id "$TASK_ID" ''{task: ("/epicd:fixpoint-convergence " + $id)}'')"'
    whenPhase: ["backlog", "implementing", "needs-human"]
  - id: "dispatch-to-author"
    label: "Dispatch to Author"
    command: 'manda-dispatch submit -id="$TASK_ID" -to=worker -async -args="$(jq -nc --arg id "$TASK_ID" ''{task: ("/epicd:authoring-convergence " + $id)}'')"'
    whenPhase: ["drafting", "refining", "needs-human"]
